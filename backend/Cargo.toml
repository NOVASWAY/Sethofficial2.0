[package]
name = "clinic-management-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4"
actix-cors = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Validation
validator = { version = "0.18", features = ["derive"] }
thiserror = "1.0"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# JWT Authentication
jsonwebtoken = "9.2"
base64 = { version = "0.20", features = ["std"] }

# Password hashing
argon2 = "0.5"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal", "ipnetwork"] }
dotenvy = "0.15"

# SSL/TLS Support
rustls = "0.21"
rustls-pemfile = "1.0"
tokio-rustls = "0.24"

# Data Encryption
aes-gcm = "0.10"
rand = "0.8"

# Email functionality
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }

# SMS functionality
twilio = "1.1"

# File upload and security
actix-multipart = "0.6"
futures-util = "0.3"
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"

# Session management
actix-session = "0.8"
actix-web-actors = "4.2"
actix = "0.13"
# Performance optimization dependencies
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
lru = "0.12"
dashmap = "5.5"

# Metrics and monitoring
prometheus = "0.13"
actix-web-prometheus = "0.1.2-beta.10"

# HTTP client for M-Pesa Daraja API
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }

# Regular expressions
regex = "1.10"

# WebSocket support
tokio-tungstenite = "0.21"

# TOTP (Time-based One-Time Password) for MFA/2FA
totp-lite = "2.0"
qrcode = "0.14"
urlencoding = "2.1"
base32 = "0.4"

# Dependency overrides to avoid edition2024 issues
base64ct = "=1.7.3"
# Pin moxcms to avoid edition2024 requirement (if it gets pulled in)
[patch.crates-io]
# Override moxcms if it's pulled in as a dependency
# moxcms = { version = "0.7.8" }  # Uncomment if needed

[dev-dependencies]
# Testing
actix-rt = "2.8"
tokio-test = "0.4"
# Note: actix-web is already in [dependencies], no need to duplicate here