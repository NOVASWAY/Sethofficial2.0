# Railway Configuration File
# This file configures Railway to build and deploy the Rust backend service
# Documentation: https://docs.railway.com/reference/config-as-code

[build]
# Use Dockerfile for building
builder = "DOCKERFILE"
# Path to Dockerfile (relative to repository root)
dockerfilePath = "Dockerfile"

# Watch patterns - trigger redeploy only when backend files change
# This is important for monorepos to avoid unnecessary redeploys
watchPatterns = [
  "backend/**",
  "Dockerfile",
  "railway.toml"
]

# Note: Railway automatically detects Dockerfile and uses it
# The CMD from Dockerfile will be used as the start command
# HEALTHCHECK from Dockerfile will be used for health checks
#
# Environment variables should be set in Railway dashboard:
# - DATABASE_URL (auto-provided by Railway PostgreSQL service)
# - JWT_SECRET (set manually)
# - CORS_ORIGINS (set manually)
# - PORT (automatically set by Railway)
# - HOST (defaults to 0.0.0.0)

