# Railway Configuration File
# This file configures Railway to build and deploy the Rust backend service
# Documentation: https://docs.railway.com/reference/config-as-code

[build]
# Use Dockerfile for building
builder = "DOCKERFILE"
# Path to Dockerfile (relative to repository root)
dockerfilePath = "Dockerfile"
# FORCE complete rebuild - disable ALL caching to ensure latest changes are used
# This ensures Railway always uses the latest Dockerfile and code
# Version 5.0: FINAL cache bust - ensure migrations run and database has tables
buildCommand = "docker build --no-cache --pull -f Dockerfile --build-arg CACHE_BUST=$(date +%s) --build-arg FORCE_REBUILD=$(date +%s%N) ."

# Watch patterns - trigger redeploy only when backend files change
# This is important for monorepos to avoid unnecessary redeploys
# UPDATED: Removed entrypoint.sh from watch (not needed, using inline script)
watchPatterns = [
  "backend/**",
  "Dockerfile",
  "railway.toml"
]

[deploy]
# Railway will use the HEALTHCHECK from Dockerfile
# Start command is defined in Dockerfile CMD
# Health check path: /health

# Environment variables should be set in Railway dashboard:
# - DATABASE_URL (auto-provided by Railway PostgreSQL service - link the Postgres service)
# - JWT_SECRET (set manually - use a strong random string)
# - CORS_ORIGINS (set manually - e.g., "https://your-frontend.netlify.app,http://localhost:3000")
# - PORT (automatically set by Railway - do not override)
# - HOST (defaults to 0.0.0.0 - do not override)
# - REDIS_URL (optional - only if using Redis)

