<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inject Console Capture</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 3px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔧 Console Capture Injection</h1>
    
    <div id="status" class="status info">
        Ready to inject console capture script...
    </div>
    
    <button onclick="injectIntoFrontend()">Inject into Frontend (localhost:3001)</button>
    <button onclick="testConsoleCapture()">Test Console Capture</button>
    <button onclick="checkMCPServer()">Check MCP Server</button>
    
    <div id="results"></div>

    <script>
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        async function injectIntoFrontend() {
            updateStatus('Injecting console capture into frontend...', 'info');
            
            try {
                // First, load the console capture script
                const script = document.createElement('script');
                script.src = 'http://localhost:8000/consolespy/extension/console-capture.js';
                script.onload = function() {
                    updateStatus('Console capture script loaded successfully!', 'success');
                    addResult('✅ Console capture script loaded', 'success');
                    
                    // Test the connection
                    setTimeout(() => {
                        if (window.mcpLog) {
                            window.mcpLog('Console capture injected successfully from injection page');
                            addResult('✅ Console capture functions available', 'success');
                        } else {
                            addResult('❌ Console capture functions not available', 'error');
                        }
                    }, 1000);
                };
                script.onerror = function() {
                    updateStatus('Failed to load console capture script', 'error');
                    addResult('❌ Failed to load console capture script', 'error');
                };
                document.head.appendChild(script);
                
            } catch (error) {
                updateStatus('Error injecting script: ' + error.message, 'error');
                addResult('❌ Error: ' + error.message, 'error');
            }
        }

        function testConsoleCapture() {
            updateStatus('Testing console capture...', 'info');
            
            // Test various console methods
            console.log('Test log from injection page', { timestamp: new Date().toISOString() });
            console.warn('Test warning from injection page');
            console.error('Test error from injection page');
            console.info('Test info from injection page');
            
            // Test manual MCP functions if available
            if (window.mcpLog) {
                window.mcpLog('Manual test log from injection page');
                window.mcpWarn('Manual test warning from injection page');
                window.mcpError('Manual test error from injection page');
                addResult('✅ Manual MCP functions tested', 'success');
            } else {
                addResult('❌ Manual MCP functions not available', 'error');
            }
            
            updateStatus('Console capture test completed!', 'success');
            addResult('✅ Console capture test completed', 'success');
        }

        async function checkMCPServer() {
            updateStatus('Checking MCP server...', 'info');
            
            try {
                const response = await fetch('http://localhost:3333/mcp');
                const data = await response.json();
                
                if (response.ok) {
                    updateStatus('MCP server is working!', 'success');
                    addResult('✅ MCP server response: ' + data.content.substring(0, 100) + '...', 'success');
                } else {
                    updateStatus('MCP server error: ' + response.status, 'error');
                    addResult('❌ MCP server error: ' + response.status, 'error');
                }
            } catch (error) {
                updateStatus('MCP server connection failed: ' + error.message, 'error');
                addResult('❌ MCP server connection failed: ' + error.message, 'error');
            }
        }

        // Auto-inject on page load
        window.onload = function() {
            console.log('Console capture injection page loaded', { timestamp: new Date().toISOString() });
            injectIntoFrontend();
        };
    </script>
</body>
</html>
